<style>
:root {
  --primary-color: #2563eb;
  --primary-hover: #1d4ed8;
  --accent-color: #3b82f6;
  --dark-bg: #0f172a;
  --success-color: #10b981;
  --warning-color: #f59e0b;
  --info-color: #0ea5e9;
  --danger-color: #ef4444;
  --surface-color: #ffffff;
  --bg-color: #f8fafc;
  --text-main: #334155;
  --text-muted: #64748b;
  --border-radius-lg: 20px;
  --border-radius-md: 12px;
  --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 20px 30px -5px rgba(0, 0, 0, 0.1);
}
body {
  background: var(--bg-color);
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}
/* Header */
.app-header {
  background: linear-gradient(135deg, var(--dark-bg), #1e293b);
  color: white;
  padding: 1.25rem 2.5rem;
  border-radius: 0 0 var(--border-radius-lg) var(--border-radius-lg);
  box-shadow: var(--shadow-md);
  margin-bottom: 30px;
  border-bottom: 2px solid rgba(255,255,255,0.05);
}
/* Map container */
#map-container {
  position: relative;
  width: 100%;
  height: 65vh;
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 6px solid var(--surface-color);
  transition: all 0.3s ease;
}
#map {
  height: 100%;
  width: 100%;
}
/* Search box */
.map-search-box {
  position: absolute;
  top: 20px;
  left: 60px;
  z-index: 1000;
  width: 320px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  padding: 10px 20px;
  border-radius: 50px;
  border: 1px solid rgba(37,99,235,0.2);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  transition: all 0.3s ease;
}
.map-search-box:focus-within {
  box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
  border-color: var(--primary-color);
}
.map-search-box input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 14px;
  font-weight: 500;
}
/* Voice button */
.voice-btn {
  border: none;
  background: rgba(37,99,235,0.1);
  cursor: pointer;
  font-size: 16px;
  padding: 8px;
  border-radius: 50%;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.voice-btn:hover {
  transform: scale(1.1);
  background: rgba(37,99,235,0.2);
}
.voice-active {
  color: var(--danger-color);
  background: rgba(239, 68, 68, 0.1);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
/* Locate button */
.locate-btn {
  position: absolute;
  bottom: 30px;
  right: 25px;
  z-index: 1000;
  background: var(--surface-color);
  color: var(--primary-color);
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 22px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  justify-content: center;
}
.locate-btn:hover {
  transform: scale(1.05) translateY(-5px);
  background: var(--primary-color);
  color: white;
}
/* Data cards (KPIs) */
.data-card {
  background: var(--surface-color);
  border-radius: var(--border-radius-lg);
  padding: 25px;
  box-shadow: var(--shadow-sm);
  margin-top: 25px;
  border: 1px solid rgba(0,0,0,0.03);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.data-card:hover {
  box-shadow: var(--shadow-md);
}
/* Tables */
.table-responsive {
  max-height: 500px;
  border-radius: var(--border-radius-md);
  border: 1px solid #e2e8f0;
}
.table {
  margin-bottom: 0;
}
.table thead {
  background: #f8fafc;
  color: var(--text-muted);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.table thead th {
  border-bottom: 2px solid #e2e8f0;
  padding: 15px;
  font-weight: 600;
}
.table tbody td {
  padding: 15px;
  vertical-align: middle;
  border-bottom: 1px solid #f1f5f9;
  font-size: 14px;
}
.table tbody tr {
  transition: all 0.2s;
}
.table tbody tr:hover {
  background-color: #f8fafc;
}
/* Highlighted row */
.highlighted-row {
  background-color: #fffbeb !important;
}
.highlighted-row td:first-child {
  border-left: 4px solid var(--warning-color);
}
/* Buttons */
.btn-highlight-action {
  background: linear-gradient(135deg, var(--warning-color), #f59e0b);
  color: #fff;
  font-weight: 600;
  border-radius: 8px;
  padding: 10px;
  border: none;
  margin-top: 10px;
  font-size: 13px;
  box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
  transition: 0.3s;
}
.btn-highlight-action:hover {
  box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4);
  transform: translateY(-2px);
  color: #fff;
}
/* Map popup */
.leaflet-popup-content-wrapper {
  border-radius: 16px;
  padding: 8px;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(0,0,0,0.05);
}
.popup-table {
  width: 100%;
  font-size: 13px;
  margin-top: 10px;
}
.popup-table td {
  padding: 4px 0;
  border-bottom: 1px dashed #e2e8f0;
}
.popup-table td:first-child {
  color: var(--text-muted);
  font-weight: 500;
  width: 45%;
}
/* Map admin alert banner */
#mapAdminAlertBanner {
  display: none;
  position: absolute;
  left: 10px;
  right: 10px;
  top: 10px;
  z-index: 1500;
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  color: #fff;
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 0 8px 28px rgba(185,28,28,.45);
  font-weight: 600;

}
#mapAdminAlertBanner .maa-title {

}
#mapAdminAlertBanner .maa-body {

}
#mapAdminAlertBanner .maa-close {

  color: #fff;
  border-radius: 8px;
  padding: 2px 8px;
}

  /* Fixed bottom nav for mobile */
  #mobileBottomNav {

<script>
/* =================== Firebase Initialization =================== */
const firebaseConfig = {
  apiKey: "AIzaSyCtUJWCd94jxseVw1xkQJJTEO4qwIUg2G4",
  authDomain: "live-map-3ceeb.firebaseapp.com",
  databaseURL: "https://live-map-3ceeb-default-rtdb.firebaseio.com",
  projectId: "live-map-3ceeb",
  storageBucket: "live-map-3ceeb.firebasestorage.app",
  messagingSenderId: "301571274340",
  appId: "1:301571274340:web:f98b4249b574ce4c1f1171"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
const storage = firebase.storage();

window.__fbAuth = auth;
window.__fbApp = firebase;

/* Paths and refs */
const sitesRef = db.ref('sites');
const liveRef = db.ref('liveLocations');
const smsRef = db.ref('smsNotifications');
const settingsRef = db.ref('appSettings');
const blockedRef = db.ref('blockedUsers');
const onlineRef = db.ref('onlineUsers');
const loggedInUsersRef = db.ref('loggedInUsers');
const workOrdersRef = db.ref('workOrders');
const userRolesRef = db.ref('userRoles');
const pgRunsRef = db.ref('pgRuns');
const pgWorkHoursRef = db.ref('pgWorkHours');
const teamLeaderCodesRef = db.ref('teamLeaderCodes');
const fuelWalletsRef = db.ref('fuelWallets');
const fuelStockRef = db.ref('fuelStock');
const fuelEditRequestsRef = db.ref('fuelEditRequests');
const fuelBackRequestsRef = db.ref('fuelBackRequests');
const otherWorkRef = db.ref('otherWork');
const accessTokensRef = db.ref('accessTokens');

/* Auto signIn anonymous */
firebase.auth().signInAnonymously().catch(e => {
  console.error('Firebase signIn error:', e);
});

/* =================== Global Variables =================== */
let sites = [];
let map, markers, mapMarkers = [], userPosMarker;

const fuelStockRef = db.ref('fuelStock');
window.__fuelStock = 0; // will be initialized from Firebase

// For fuel wallets
window.__fuelWallets = {};
window.__fuelBackRequests = [];
window.__fuelEditRequests = [];

/* =================== Utility Functions =================== */
function showToast(message, isSuccess = true) {
  const toastEl = document.getElementById('liveToast');
  if (!toastEl) return;
  const toastBody = document.getElementById('toastMessage');
  toastBody.innerText = message;
  toastEl.classList.remove('bg-success', 'bg-danger');
  toastEl.classList.add(isSuccess ? 'bg-success' : 'bg-danger');
  const toast = new bootstrap.Toast(toastEl);
  toast.show();
}
function setSyncStatus(status) {
  const el = document.getElementById('cloudSyncStatus');
  if (!el) return;
  if (status === 'saving') {
    el.className = 'badge bg-warning text-dark rounded-pill px-3 py-2 fw-bold';
    el.innerHTML = '🔄 Saving...';
  } else if (status === 'success') {
    el.className = 'badge bg-success text-white rounded-pill px-3 py-2 fw-bold';
    el.innerHTML = '✅ Data Saved';
    setTimeout(() => {
      el.innerHTML = '☁️ Synced';
      el.className = 'badge bg-secondary text-white rounded-pill px-3 py-2 fw-bold';
    }, 3000);
  } else if (status === 'failed') {
    el.className = 'badge bg-danger text-white rounded-pill px-3 py-2 fw-bold';
    el.innerHTML = '❌ Save Failed';
  }
}

/* =================== Firebase Sync & Initialization =================== */
firebase.auth().onAuthStateChanged(user => {
  if (user) {
    // User signed in, can proceed
  }
});
// Load fuel stock from Firebase
db.ref('fuelStock').once('value').then(snap => {
  window.__fuelStock = snap.val() || 0;
  updateFuelKPIs();
});
/* =================== Map Initialization =================== */
function initMap() {
  if (!map) {
    map = L.map('map', { center: [23.94, 90.72], zoom: 11 });
    const street = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}');
    const satellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}');
    const traffic = L.tileLayer('https://mt1.google.com/vt/lyrs=h,traffic&x={x}&y={y}&z={z}');
    L.control.layers(
      { "Street Map": street, "Satellite View": satellite, "Live Traffic": traffic },
      null,
      { position: 'topright' }).addTo(map);
  }
  if (markers) markers.clearLayers(); else markers = L.markerClusterGroup();
  mapMarkers = [];
  (sites || []).forEach(s => {
    if (!s || !Number.isFinite(Number(s.LAT)) || !Number.isFinite(Number(s.LONG))) return;
    const isH = s.highlight || false;
    const navUrl = `https://www.google.com/maps?q=${s.LAT},${s.LONG}`;
    const popupContent = `
      <div style="min-width:200px">
        <h6 class="text-primary fw-bold mb-2">ID: ${s.SiteID} ${isH ? '🚨' : ''}</h6>
        <div class="mobile-assigned-team assigned-team-mobile">
          <span>👥 Assigned Team:</span>
          <strong>${s.AssignedTo || 'Unassigned'}</strong>
        </div>
        <div class="mb-2 small d-flex justify-content-between align-items-center">
          <div><b>Team:</b> ${s.AssignedTo || 'Unassigned'}</div>
          <span class="btn-mini text-warning edit-icon mobile-hide-popup-action" style="padding:2px; font-size:12px;" onclick="prepareEdit('${s.SiteID}')" title="Edit Site">📝</span>
        </div>
        <div class="mb-2 small"><b>Status:</b> ${s.CurrentStatus || 'Normal'}</div>
        <div class="mobile-popup-title">📋 Site Details</div>
        <table class="popup-table">
          <tr><td><b>Address</b></td><td>${s.Address || '-'}</td></tr>
          <tr><td><b>Gate</b></td><td>${s.Gate || '-'}</td></tr>
          <tr><td><b>BTS Key</b></td><td>${s.BTS || '-'}</td></tr>
          <tr><td><b>Battery</b></td><td>${s.Battery || '-'}</td></tr>
          <tr><td><b>Roof</b></td><td>${s.Roof || '-'}</td></tr>
          <tr><td><b>SG</b></td><td>${s.SG || '-'}</td></tr>
          <tr><td><b>Name</b></td><td>${s.Name || '-'}</td></tr>
          <tr><td><b>Note 1</b></td><td>${s.Note1 || '-'}</td></tr>
          <tr><td><b>Note 2</b></td><td>${s.Note2 || '-'}</td></tr>
          <tr><td><b>Latitude</b></td><td>${s.LAT ?? '-'}</td></tr>
          <tr><td><b>Longitude</b></td><td>${s.LONG ?? '-'}</td></tr>
        </table>
        <button class="btn-highlight-action mt-3 mobile-hide-popup-action" onclick="toggleHighlight('${s.SiteID}')">
          ${isH ? '✅ Clear Task' : '🚨 Highlight Site'}
        </button>
        <button type="button" class="btn btn-primary btn-sm w-100 mt-2 fw-bold" onclick="openSiteDetails('${s.SiteID}')">📋 Full Site Details</button>
        <button type="button" class="mobile-view-btn" onclick="viewSiteOnMap('${s.SiteID}')">👁️ View Site</button>
        <a href="${navUrl}" target="_blank" rel="noopener" class="btn-nav">🧭 Navigate to Site</a>
      </div>`;
    const m = L.marker([s.LAT, s.LONG], { icon: (s.highlight ? yellowIcon : blueIcon) })
      .bindPopup(popupContent)
      .bindTooltip(`${s.SiteID} (${s.AssignedTo || ''})`, {
        permanent: true,
        className: (s.highlight ? 'site-label site-label-active' : 'site-label')
      });
    m.on('click', () => {
      if (typeof calculateSiteToSiteMatrixV4 === 'function') {
        calculateSiteToSiteMatrixV4(s);
      }
    });
    markers.addLayer(m);
    mapMarkers.push({ marker: m, site: s });
  });
  map.addLayer(markers);
  updateSiteCount();
}

// Highlight toggle
function toggleHighlight(id) {
  const site = sites.find(s => s.SiteID === id);
  if (site) {
    site.highlight = !site.highlight;
    // Speak alert
    if (site.highlight) { speak(` ${site.SiteID} site in`); } 
    else { speak(`Task cleared for ${site.SiteID}`); }
    save({ skipMap:true, skipGraph:true, skipLive:true });
    // Toggle button UI
    try {
      const btn = document.querySelector('.highlight-btn-card[onclick*="'+id+'"]');
      if (btn) {
        btn.classList.toggle('h-on', !!site.highlight);
        btn.classList.toggle('h-off', !site.highlight);
        btn.textContent = site.highlight ? '🚨' : '⚪';
      }
    } catch(e) {}
  }
  // Map popup
  const mData = mapMarkers.find(m => m.site.SiteID === id);
  if (mData && site && site.highlight) {
    map.setView(mData.marker.getLatLng(), 17);
    mData.marker.openPopup();
  }
}

// Search functions
function syncSearch(val, sourceEl) {
  clearTimeout(_syncSearchTimer);
  _syncSearchTimer = setTimeout(() => syncSearchNow(val, sourceEl), 120);
}
var _syncSearchTimer = null;
var _syncSearchComposing = false;
document.addEventListener('compositionstart', e => {
  if (e.target && ['mapSearchInput', 'mainSearchInput', 'adminSearchInput'].includes(e.target.id)) {
    _syncSearchComposing = true;
  }
});
document.addEventListener('compositionend', e => {
  if (e.target && ['mapSearchInput', 'mainSearchInput', 'adminSearchInput'].includes(e.target.id)) {
    _syncSearchComposing = false;
    try { syncSearchNow(e.target.value, e.target); } catch(e) {}
  }
});
function syncSearchNow(val, sourceEl) {
  const q = String(val || '').toUpperCase().trim();
  try {
    const a = document.getElementById('mapSearchInput');
    const b = document.getElementById('mainSearchInput');
    if (sourceEl && sourceEl.id === 'mapSearchInput') {
      if (b && b.value !== val) b.value = val;
    } else if (sourceEl && sourceEl.id === 'mainSearchInput') {
      if (a && a.value !== val) a.value = val;
    } else {
      if (a && document.activeElement !== a && a.value !== val) a.value = val;
      if (b && document.activeElement !== b && b.value !== val) b.value = val;
    }
  } catch(e) {}
  // Filter sites
  const filterEl = document.getElementById('tableStatusFilterPremium');
  const currentFilter = filterEl ? filterEl.value : 'ALL';
  let firstResult = null;
  const rows = document.querySelectorAll('#siteTable tr');
  const isMobile = window.innerWidth < 768 || /Mobi|Android/i.test(navigator.userAgent);
  for (let i=0; i<sites.length; i++) {
    const site = sites[i];
    const matchesQuery = !q || String(site.SiteID || '').toUpperCase().includes(q) || String(site.Address || '').toUpperCase().includes(q) || String(site.AssignedTo || '').toUpperCase().includes(q) || String(site.Battery || '').toUpperCase().includes(q) || String(site.BTS || '').toUpperCase().includes(q) || String(site.Gate || '').toUpperCase().includes(q);
    let matchesFilter = true;
    const currentStatus = site.CurrentStatus || 'Normal';
    if (currentFilter === 'ALL') {
      matchesFilter = true;
    } else if (currentFilter === 'Highlighted') {
      matchesFilter = !!site.highlight;
    } else {
      matchesFilter = (currentStatus === currentFilter);
    }
    const match = matchesQuery && matchesFilter;
    if (rows[i]) rows[i].style.display = match ? '' : 'none';

    // Map marker icon change
    const mData = mapMarkers.find(m => m.site.SiteID === site.SiteID);
    if (mData) {
      if (q && match) {
        if (!isMobile) mData.marker.setIcon(redIcon);
        if (!firstResult) firstResult = mData;
      } else if (!isMobile) {
        mData.marker.setIcon(site.highlight ? yellowIcon : blueIcon);
      }
    }
  }
  if (firstResult && q) {
    try {
      map.setView(firstResult.marker.getLatLng(), isMobile ? 15 : 16);
      if (!isMobile) firstResult.marker.openPopup();
    } catch(e) {}
  }
}

    if (site.highlight) { speak(` ${site.SiteID} site in`); }

    save({ skipMap:true, skipGraph:true, skipLive:true });
    try {
      const btn = document.querySelector('.highlight-btn-card[onclick*="'+id+'"]');
      if (btn) {
        btn.classList.toggle('h-on', !!site.highlight);
        btn.classList.toggle('h-off', !site.highlight);
        btn.textContent = site.highlight ? '🚨' : '⚪';
      }
    } catch(e) {}
  }

    mData.marker.openPopup();
  }

function initMap() {
  if (!map) {
    map = L.map('map', { center: [23.94, 90.72], zoom: 11 });
    const street = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}');
    const satellite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}');
    const traffic = L.tileLayer('https://mt1.google.com/vt/lyrs=h,traffic&x={x}&y={y}&z={z}');
    L.control.layers(
      { "Street Map": street, "Satellite View": satellite, "Live Traffic": traffic },
      null,
      { position: 'topright' }
    ).addTo(map);
  }
  if (markers) markers.clearLayers(); else markers = L.markerClusterGroup();
  mapMarkers = [];
  (sites || []).forEach(s => {
    if (!s || !Number.isFinite(Number(s.LAT)) || !Number.isFinite(Number(s.LONG))) return;
    const isH = s.highlight || false;
    const navUrl = `https://www.google.com/maps?q=${s.LAT},${s.LONG}`;
    const popupContent = `
      <div style="min-width:200px">

        </div>
        <div class="mb-2 small"><b>Status:</b> ${s.CurrentStatus || 'Normal'}</div>
        <div class="mobile-popup-title">📋 Site Details</div>
        <table class="popup-table">
          <tr><td><b>Address</b></td><td>${s.Address || '-'}</td></tr>
          <tr><td><b>Gate</b></td><td>${s.Gate || '-'}</td></tr>
          <tr><td><b>BTS Key</b></td><td>${s.BTS || '-'}</td></tr>
          <tr><td><b>Battery</b></td><td>${s.Battery || '-'}</td></tr>
          <tr><td><b>Roof</b></td><td>${s.Roof || '-'}</td></tr>
          <tr><td><b>SG</b></td><td>${s.SG || '-'}</td></tr>
          <tr><td><b>Name</b></td><td>${s.Name || '-'}</td></tr>
          <tr><td><b>Note 1</b></td><td>${s.Note1 || '-'}</td></tr>
          <tr><td><b>Note 2</b></td><td>${s.Note2 || '-'}</td></tr>
          <tr><td><b>Latitude</b></td><td>${s.LAT ?? '-'}</td></tr>
          <tr><td><b>Longitude</b></td><td>${s.LONG ?? '-'}</td></tr>
        </table>
        <button class="btn-highlight-action mt-3 mobile-hide-popup-action" onclick="toggleHighlight('${s.SiteID}')">
          ${isH ? '✅ Clear Task' : '🚨 Highlight Site'}
        </button>
        <button type="button" class="btn btn-primary btn-sm w-100 mt-2 fw-bold" onclick="openSiteDetails('${s.SiteID}')">📋 Full Site Details</button>
        <button type="button" class="mobile-view-btn" onclick="viewSiteOnMap('${s.SiteID}')">👁️ View Site</button>
        <a href="${navUrl}" target="_blank" rel="noopener" class="btn-nav">🧭 Navigate to Site</a>
      </div>`;
    const m = L.marker([s.LAT, s.LONG], { icon: (s.highlight ? yellowIcon : blueIcon) })
      .bindPopup(popupContent)
      .bindTooltip(`${s.SiteID} (${s.AssignedTo || ''})`, { permanent: true, className: (s.highlight ? 'site-label site-label-active' : 'site-label') });
    m.on('click', () => {
      if (typeof calculateSiteToSiteMatrixV4 === 'function') {
        calculateSiteToSiteMatrixV4(s);
      }
    });
    markers.addLayer(m);
    mapMarkers.push({ marker: m, site: s });
  });
  map.addLayer(markers);
}

function loadFuelDashboard() {
  // Load fuel wallet info, stock, back requests

        used += Number(r.fuel) || 0;

    }
  });
  document.getElementById('fuelTotalUsed').innerText = used.toFixed(2) + ' L';
  // Compute balance
  const balance = stock - used;
  document.getElementById('fuelBalance').innerText = balance.toFixed(2) + ' L';
  // Load pending back requests
  fetchFuelBackRequests();
  // Load wallets
  fetchFuelWallets();
}

/* =================== Fuel Management Actions =================== */
function adminManualFuelAdd() {
  const op = document.getElementById('fuelAddOp').value.trim();
  const qtyStr = document.getElementById('fuelAddQty').value.trim();
  const qty = parseFuelNumber(qtyStr);
  if (!op) { alert('Enter operator / team'); return; }
  if (isNaN(qty) || qty === 0) { alert('Enter litres (e.g. 10,5 or -5)'); return; }
  // Update stock
  window.__fuelStock = (window.__fuelStock || 0) + qty;
  if (window.__fuelStock < 0) {
    alert('Not enough stock! Cannot take more back than available.');
    // revert
    window.__fuelStock -= qty;
    return;
  }
  // Save to Firebase
  db.ref('fuelStock').set(window.__fuelStock);
  // Update wallet
  const wallet = getFuelWallet(op);
  wallet.added += qty;
  if (wallet.added < 0) wallet.added = 0;
  wallet.logs = wallet.logs || [];
  wallet.logs.unshift({
    date: new Date().toISOString().slice(0,10),
    siteId: 'ADMIN',
    add: qty,
    used: 0,
    ts: Date.now(),
    note: 'Admin manual add/reduce'
  });
  // Save wallet
  db.ref('fuelWallets/' + encodeURIComponent(op)).set(wallet);
  loadFuelDashboard();
  showToast(`Fuel updated: ${qty} L for ${op}`, true);
}
function getFuelWallet(op) {
  if (!window.__fuelWallets) window.__fuelWallets = {};
  if (!window.__fuelWallets[op]) {
    window.__fuelWallets[op] = { name: op, added: 0, used: 0, balance: 0, logs: [] };
  }
  return window.__fuelWallets[op];
}
function parseFuelNumber(str) {
  if (!str) return NaN;
  str = String(str).replace(/\s+/g,'');
  if (!str) return NaN;
  // replace comma with dot if comma is decimal
  if (str.indexOf(',') > str.lastIndexOf('.')) {
    str = str.replace(/,/g, '');
  } else {
    str = str.replace(/,/g, '.');
  }
  const num = parseFloat(str);
  return isNaN(num) ? NaN : num;
}
function exportFuelMonthCsv() {
  const month = document.getElementById('fuelMonthPick').value || new Date().toISOString().slice(0,7);
  let lines = ['Date,Operator,Site,Add_L,Used_L'];
  // From logs of wallets
  for (const k in window.__fuelWallets) {
    const w = window.__fuelWallets[k];
    (w.logs || []).forEach(l => {
      if (l.date.startsWith(month)) {
        lines.push(`${l.date},${w.name},${l.siteId},${l.add},${l.used}`);
      }
    });
  }
  // From PG runs
  (sites || []).forEach(s => {
    if (s.PgRuns && Array.isArray(s.PgRuns)) {
      s.PgRuns.forEach(r => {
        if (r.date.startsWith(month)) {
          lines.push(`${r.date},${s.AssignedTo || ''},${s.SiteID},${r.fuel},0`);
        }
      });
    }
  });
  const blob = new Blob([lines.join('\n')], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Fuel_${month}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Fuel CSV exported', true);
}
/* =================== Fuel Requests & Admin Actions =================== */
function requestFuelBack() {
  const op = document.getElementById('fuelAddOp').value.trim();
  const qtyStr = document.getElementById('fuelAddQty').value.trim();
  const qty = parseFuelNumber(qtyStr);
  if (!op || isNaN(qty) || qty === 0) {
    alert('Enter operator / team and litres');
    return;
  }
  // Save request in Firebase
  const req = {
    id: 'fb_' + Date.now(),
    operator: op,
    actor: 'admin', // for demo
    qty: qty,
    note: 'Fuel back request',
    status: 'pending',
    ts: Date.now(),
    date: new Date().toISOString().slice(0,10)
  };
  db.ref('fuelBackRequests').push(req);
  showToast(`Fuel back request for ${op} (${qty}L) sent`, true);
  loadFuelDashboard();
}
function fetchFuelBackRequests() {
  db.ref('fuelBackRequests').once('value').then(snap => {
    const data = snap.val() || [];
    // For demo, just show count
    document.getElementById('fuelBackReq').innerText = data.length;
  });
}
function fetchFuelWallets() {
  db.ref('fuelWallets').once('value').then(snap => {
    window.__fuelWallets = snap.val() || {};
    // update display
    displayFuelWallets();
  });
}
function displayFuelWallets() {
  const cont = document.getElementById('fuelWalletsList');
  if (!cont) return;
  cont.innerHTML = '';
  for (const k in window.__fuelWallets) {
    const w = window.__fuelWallets[k];
    cont.innerHTML += `<div style="border:1px solid #ccc; padding:4px; margin:4px; border-radius:4px;">
      <b>${w.name}</b><br>Added: ${w.added} L<br>Used: ${w.used} L<br>Balance: ${w.balance} L
    </div>`;
  }
}
/* =================== Sign-in with Google & Token =================== */
function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res => {
    const user = res.user;
    if (user) {
      // Save profile
      persistUserProfile(user.displayName || 'User', user.email || '', user.uid, user.photoURL || '');
      $('#userProfileModal').modal('hide');
      showToast('Google login: ' + (user.displayName || 'User'), true);
    }
  }).catch(e => {
    showToast('Google login failed', false);
    console.error(e);
  });
}
function loginWithAccessToken() {
  const token = document.getElementById('userAccessTokenInput').value.trim();
  if (!token) {
    showToast('Enter token', false);
    return;
  }
  // For demo, accept all tokens
  // In production, verify token in backend
  adminSessionToken = 'token-' + token + '-' + Date.now();
  $('#userProfileModal').modal('hide');
  showToast('Token login: ' + token, true);
  // Save token
  localStorage.setItem('rafinoor_access_token', token);
}

/* =================== Utility functions for profile & tokens */
function persistUserProfile(name, email, uid, photo) {
  localStorage.setItem('rafinoor_user_name', name);
  localStorage.setItem('rafinoor_user_email', email);
  localStorage.setItem('rafinoor_user_uid', uid);
  localStorage.setItem('rafinoor_user_photo', photo);
}
function getUserDisplayName() {
  return localStorage.getItem('rafinoor_user_name') || 'User';
}
function getUserPhoto() {
  return localStorage.getItem('rafinoor_user_photo') || '';
}
function setMyTeam(team) {
  localStorage.setItem('rafinoor_my_team', team);
}
function getMyTeam() {
  return localStorage.getItem('rafinoor_my_team') || '';
}
function setLocalUserRole(role) {
  localStorage.setItem('rafinoor_user_role', role);
}
function getLocalUserRole() {
  return localStorage.getItem('rafinoor_user_role') || 'TECHNICIAN';
}

/* =================== Map & Map Control Buttons =================== */
function startVoiceRecognition() {
  if (!('webkitSpeechRecognition' in window)) {
    alert('Voice recognition not supported');
    return;
  }
  const recognition = new webkitSpeechRecognition();
  recognition.lang = 'en-US';
  recognition.onresult = e => {
    const transcript = e.results[0][0].transcript.replace(/\./g, '').trim();
    syncSearch(transcript);
  };
  recognition.onspeechend = () => { recognition.stop(); };
  recognition.onerror = () => { recognition.stop(); };
  recognition.start();
}
function locateUser() {
  if (!map) return;
  map.locate({ setView: true, maxZoom: 16 });
  map.on('locationfound', e => {
    if (userPosMarker) map.removeLayer(userPosMarker);
    userPosMarker = L.circleMarker(e.latlng, { radius: 10, fillColor: '#10b981', color: '#fff', weight: 3, fillOpacity: 0.9 }).addTo(map);
    document.getElementById('editLAT').value = e.latitude.toFixed(6);
    document.getElementById('editLONG').value = e.longitude.toFixed(6);
  });
}

/* =================== Map Map & Map Buttons (full control) */
function goFullScreen() {
  const el = document.getElementById('map-container');
  if (el && el.requestFullscreen) el.requestFullscreen();
  else if (el && el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

/* =================== Map Layer Toggle */
function toggleWeatherPremium() {
  // For demo, toggle a precipitation layer
  if (window.weatherLayerPremium) {
    map.removeLayer(window.weatherLayerPremium);
    window.weatherLayerPremium = null;
  } else {
    window.weatherLayerPremium = L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=5629ca71dfd498188b6033fcb7496668');
    window.weatherLayerPremium.addTo(map);
  }
}

/* =================== Map & Map Controls =================== */
function applyLiveMapStatusFilterV4(val) {
  // Filter sites on map
  if (!map || !mapMarkers) return;
  markers.clearLayers();
  mapMarkers.forEach(m => {
    const status = m.site.CurrentStatus || 'Normal';
    const high = m.site.highlight || false;
    let visible = false;
    if (val === 'ALL') visible = true;
    else if (val === 'Highlighted' && high) visible = true;
    else if (status === val) visible = true;
    if (visible) markers.addLayer(m.marker);
  });
  document.getElementById('tableStatusFilterPremium').value = val;
  filterSiteTableByStatusV4(val);
}

/* =================== Utility for Font Awesome icons if needed */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.0;
  utter.pitch = 1.0;
  window.speechSynthesis.speak(utter);
}

/* =================== Map & Map Events =================== */
document.addEventListener('DOMContentLoaded', () => {
  // Map init
  initMap();
  // Load sites
  db.ref('sites').once('value').then(snap => {
    sites = snap.val() || [];
    initMap();
    renderSiteTable();
  });
  // Load fuel stock
  db.ref('fuelStock').once('value').then(snap => {
    window.__fuelStock = snap.val() || 0;
    updateFuelKPIs();
  });
  // Load fuel wallets
  db.ref('fuelWallets').on('value', snap => {
    window.__fuelWallets = snap.val() || {};
    displayFuelWallets();
  });
  // Load fuel back requests
  db.ref('fuelBackRequests').on('value', snap => {
    const data = snap.val() || [];
    document.getElementById('fuelBackReq').innerText = data.length;
  });
  // Load sign-in state
  restoreAdminSession();
  // Other initializations
  refreshSmsTeamOptions();
  setupFilters();
  // Map controls
  document.getElementById('mapSearchInput').parentNode.insertBefore(mapSearchInput, document.getElementById('mapSearchInput'));
  // Map filters
  injectMapFilterControls();
  // Map weather toggle button
  document.querySelector('.weather-map-btn').onclick = toggleWeatherPremium;
  // Map filter change
  document.getElementById('mapLiveStatusFilter').onchange = () => {
    applyLiveMapStatusFilterV4(document.getElementById('mapLiveStatusFilter').value);
  };
  // Map filter panel
  injectThemeFilterControls();
  // Top menu
  document.getElementById('profileFab').onclick = openProfileMenu;
  document.getElementById('profileFab').onmouseover = () => { refreshProfileFab(); };
  // Search inputs
  document.getElementById('mapSearchInput').oninput = () => syncSearch(document.getElementById('mapSearchInput').value, document.getElementById('mapSearchInput'));
  document.getElementById('mainSearchInput').oninput = () => syncSearch(document.getElementById('mainSearchInput').value, document.getElementById('mainSearchInput'));
  // Map locate button
  document.querySelector('.locate-btn').onclick = locateUser;
});
</script>
